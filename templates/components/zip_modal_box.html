<div
    id="zip_modal_box"
    class="modal-box"
    {%
    if
    zip_id
    %}hx-get="/files/status/{{ zip_id }}"
    hx-swap="none"
    hx-trigger="every 5s"
    {%
    endif
    %}
>
    {% if zip_id %}
    <h3 id="zip-modal-title" class="text-lg font-bold">
        Votre téléchargement est en cours de préparation
    </h3>

    <span class="loading loading-spinner loading-xl"></span>
    {% elif path %}
    <h3 id="zip-modal-title" class="text-lg font-bold">
        Votre téléchargement est prêt à être téléchargé
    </h3>
    <a href="/static/{{ path }}" class="btn btn-primary">Télécharger</a>
    {% else %}
    <h3 id="zip-modal-title" class="text-lg font-bold">
        Une erreur est survenue
    </h3>
    {% endif %}
</div>
