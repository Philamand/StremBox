{% for file in files %}
<tr>
    <th>
        {% if file.is_dir %}<svg
            xmlns="http://www.w3.org/2000/svg"
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="lucide lucide-folder-icon lucide-folder"
        >
            <path
                d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"
            /></svg
        >{% else %}<svg
            xmlns="http://www.w3.org/2000/svg"
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="lucide lucide-file-icon lucide-file"
        >
            <path
                d="M6 22a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h8a2.4 2.4 0 0 1 1.704.706l3.588 3.588A2.4 2.4 0 0 1 20 8v12a2 2 0 0 1-2 2z"
            />
            <path d="M14 2v5a1 1 0 0 0 1 1h5" /></svg
        >{% endif %}
    </th>
    <td>
        {% if file.is_dir %}<a
            href=""
            hx-get="/files/?folder={% if folder %}{{ folder }}/{% endif %}{{ file.name }}"
            hx-target="#file_list_body"
            hx-push-url="true"
            >{{ file.name }}</a
        >{% else %}{{ file.name }}{% endif %}
    </td>
    <td>{% if file.size %}{{ file.size|filesizeformat }}{% endif %}</td>
    <td>
        {% if file.last_modified %}{{
        file.last_modified|relative_time|capitalize }}{% endif %}
    </td>
</tr>
{% endfor %}
