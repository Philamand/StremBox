{% extends "base.html" %} {% block content %} {% for torrent in torrent_list %}
<div class="card bg-base-100 w-full shadow-sm mb-4">
    <div class="card-body">
        <h2 class="card-title">{{ torrent.name }}</h2>
        <p>{{ torrent.num_seeds }} Seeds - {{ torrent.num_leechs }} Leechs</p>
        <div class="grid grid-cols-2 gap-4">
            <button class="btn btn-primary">
                <svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="24"
                    height="24"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    class="lucide lucide-download-icon lucide-download"
                >
                    <path d="M12 15V3" />
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                    <path d="m7 10 5 5 5-5" />
                </svg>
                <span class="ml-2">Télécharger</span>
            </button>
            <button class="btn btn-error">
                <svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="24"
                    height="24"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    class="lucide lucide-trash-icon lucide-trash"
                >
                    <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6" />
                    <path d="M3 6h18" />
                    <path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" /></svg
                ><span class="ml-2">Supprimer</span>
            </button>
        </div>
    </div>
</div>
{% endfor %} {% endblock %}
