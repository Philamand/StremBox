networks:
  app-network:
    driver: bridge

services:
  caddy:
    image: caddy:latest
    container_name: streamer_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy-data:/data
      - caddy-config:/config
    environment:
      - ACME_AGREE=true
    privileged: true
    networks:
      - app-network
    depends_on:
      - fastapi

  gluetun:
    image: qmcgaw/gluetun
    container_name: gluetun
    cap_add:
      - NET_ADMIN
    env_file:
      - .gluetun.env
    privileged: true
    volumes:
      - ./gluetun:/gluetun
    networks:
      - app-network
    restart: unless-stopped

  transmission:
    image: lscr.io/linuxserver/transmission:latest
    container_name: transmission
    network_mode: "service:gluetun"
    env_file:
      - .transmission.env
    privileged: true
    volumes:
      - downloads:/downloads
      - ./transmission-config:/config
    restart: unless-stopped
    depends_on:
      - gluetun

  fastapi:
    build:
      context: ./
      dockerfile: Dockerfile
    container_name: streamer_fastapi
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - downloads:/app/downloads
    depends_on:
      - transmission
    networks:
      - app-network
volumes:
  downloads:
  caddy-data:
  caddy-config:
